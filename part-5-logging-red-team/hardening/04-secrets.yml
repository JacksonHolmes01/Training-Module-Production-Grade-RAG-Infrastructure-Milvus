# Layer 4: take the API key out of environment variables (Lesson 8).
# The key is mounted as a read-only file instead. (Milvus's and MinIO's
# passwords have been files since Part 3.)
#
# "!override" replaces a service's whole environment list. It is the same
# list as docker-compose.yml (plus Layer 1's additions), minus EDGE_API_KEY,
# plus EDGE_API_KEY_FILE pointing at the mounted secret.
services:
  ingestion-api:
    environment: !override
      APP_TENANT: "${APP_TENANT:-lab}"
      MILVUS_URL: "http://milvus:19530"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:1b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      EMBED_DIM: "${EMBED_DIM:-768}"
      RAG_TOP_K: "${RAG_TOP_K:-4}"
      RAG_MAX_SOURCE_CHARS: "${RAG_MAX_SOURCE_CHARS:-1200}"
      ENABLE_DEBUG_ENDPOINTS: "${ENABLE_DEBUG_ENDPOINTS:-true}"
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0}"
      # Prompt injection defenses (Part 3). Set in .env.
      GUARD_INPUT: "${GUARD_INPUT:-false}"
      GUARD_INGEST: "${GUARD_INGEST:-false}"
      GUARD_PROMPT: "${GUARD_PROMPT:-false}"
      PROMPT_SANITIZE: "${PROMPT_SANITIZE:-true}"
      GUARD_OUTPUT: "${GUARD_OUTPUT:-false}"
      ALLOWED_LINK_DOMAINS: "${ALLOWED_LINK_DOMAINS:-example.org}"
      PYTHONDONTWRITEBYTECODE: "1"
      EDGE_API_KEY_FILE: /run/secrets/edge_api_key
    secrets:
      - milvus_writer_password
      - milvus_reader_password
      - edge_api_key

  nginx:
    environment: !reset {}
    volumes: !override
      - ./nginx/templates-keyfile:/etc/nginx/templates:ro
      - ./secrets/edge_key.map:/etc/nginx/secrets/edge_key.map:ro

  gradio-ui:
    environment: !override
      API_BASE_URL: "http://nginx:8088"
      GRADIO_HTTP_TIMEOUT_S: "${GRADIO_HTTP_TIMEOUT_S:-600}"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      EDGE_API_KEY_FILE: /run/secrets/edge_api_key
    secrets:
      - edge_api_key

secrets:
  edge_api_key:
    file: ./secrets/edge_api_key.txt
